[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12,<0.13" ]

[project]
name = "pyramid-localize"
version = "2.0.0"
description = """\
    pyramid_localize provides translation methods for pyramid, and means to reload translations without stopping the \
    application\
    """
readme = "README.rst"
keywords = [ "babel", "i18n", "l10n", "pyramid" ]
license = "MIT"
license-files = [ "LICENSE" ]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Pyramid",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database :: Front-Ends",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: WSGI",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pycountry>=23.12.7",
    "pyramid>=1.5",
    "pyramid-basemodel",
    "pyramid-mako",
    "sqlalchemy",
    "translationstring"
]

[[project.authors]]
name = "Grzegorz Śliwiński"
email = "fizyk+pypi@fizyk.dev"

[project.optional-dependencies]
docs = [ "sphinx" ]
babel = [ "babel>=1.0" ]

[project.urls]
Source = "https://github.com/fizyk/pyramid_localize/"
"Bug Tracker" = "https://github.com/fizyk/pyramid_localize/issues"
Changelog = "https://github.com/fizyk/pyramid_localize/blob/v2.0.0/CHANGES.rst"

[dependency-groups]
dev = [
    "babel==2.18.0",
    "mock==5.2.0",
    "pycountry==26.2.16",
    "pyramid==2.1.0",
    "pyramid-basemodel==0.7.1",
    "pyramid-mako==1.1.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-pyramid==1.1.0",
    "sqlalchemy==2.0.52",
    "towncrier==25.8.0",
    "translationstring==1.4",
    "zope-sqlalchemy==4.1",
]
release = [
    "tbump==6.11.0",
]

[tool.uv.build-backend]
module-name = "pyramid_localize"
module-root = ""
source-include = [ "CHANGES.rst" ]

[tool.ruff]
target-version = "py310"
line-length = 120
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "D",   # pydocstyle
    "PL",  # pylint
    "FBT", # flake8-boolean-trap
]

[tool.pyproject-fmt]
column_width = 120
indent = 4
keep_full_version = true
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"

[tool.tbump]

[[tool.tbump.before_commit]]
name = "Build changelog"
cmd = "uv run towncrier build --version {new_version} --yes"

[[tool.tbump.field]]
name = "extra"
default = ""

[[tool.tbump.file]]
src = "docs/source/conf.py"

[[tool.tbump.file]]
src = "pyramid_localize/__init__.py"

[[tool.tbump.file]]
src = "README.rst"

[[tool.tbump.file]]
src = "pyproject.toml"
search = 'version = "{current_version}"'

[[tool.tbump.file]]
src = "pyproject.toml"
search = 'Changelog = "https://github.com/fizyk/pyramid_localize/blob/v{current_version}/CHANGES.rst"'

[tool.tbump.git]
message_template = "Release {new_version}"
tag_template = "v{new_version}"

[tool.tbump.version]
current = "2.0.0"
regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  (\-
    (?P<extra>.+)
  )?
  '''

[tool.towncrier]
directory = "newsfragments"
filename = "CHANGES.rst"
issue_format = "`#{issue} <https://github.com/fizyk/pyramid_localize/issues/{issue}>`_"
single_file = true

[[tool.towncrier.type]]
directory = "break"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "depr"
name = "Deprecations"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bugfixes"
showcontent = true

[[tool.towncrier.type]]
directory = "docs"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Miscellaneous"
showcontent = true
